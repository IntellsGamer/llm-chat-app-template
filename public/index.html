<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Chat · Modern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        /* ——— VARIABLES (original names preserved) ——— */
        :root {
            --primary-color: #f6821f;
            --primary-hover: #e67e22;
            --light-bg: #f9fafb;
            --border-color: #e5e7eb;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --user-msg-bg: #fff2e6;
            --assistant-msg-bg: #f3f4f6;

            /* ——— modern additions (from your uploaded files) ——— */
            --bg-deep: #07070d;
            --surface-glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glow-primary: rgba(246, 130, 31, 0.25);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-card: 0 20px 60px -12px rgba(0, 0, 0, 0.6);
            --transition-smooth: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-deep);
            color: #f0f2f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
            background-image: radial-gradient(circle at 20% 30%, rgba(246, 130, 31, 0.07) 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, rgba(246, 130, 31, 0.03) 0%, transparent 40%);
        }

        /* ——— grid background (like uploaded) ——— */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.025) 1px, transparent 0);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        /* ——— HEADER ——— */
        header {
            text-align: center;
            margin-bottom: 2.25rem;
            padding: 0.5rem 0;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 820px;
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f6821f, #faa75e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            margin-bottom: 0.2rem;
            text-shadow: 0 0 40px rgba(246, 130, 31, 0.15);
        }

        header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            background: rgba(255, 255, 255, 0.03);
            display: inline-block;
            padding: 0.25rem 1.5rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ——— CHAT CONTAINER (glass-morphism) ——— */
        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 820px;
            height: calc(100vh - 240px);
            min-height: 480px;
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* glowing orbs (like uploaded) */
        .chat-container::before,
        .chat-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
            opacity: 0.25;
            z-index: 0;
        }
        .chat-container::before {
            width: 160px;
            height: 160px;
            top: -60px;
            right: -40px;
            background: color-mix(in srgb, var(--primary-color) 15%, transparent);
            animation: orbFloat 14s ease-in-out infinite alternate;
        }
        .chat-container::after {
            width: 120px;
            height: 120px;
            bottom: -40px;
            left: -30px;
            background: color-mix(in srgb, #f6821f 8%, transparent);
            animation: orbFloat 18s ease-in-out infinite alternate-reverse;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, -15px) scale(1.2); }
        }

        /* ——— MESSAGES AREA ——— */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.75rem 1.5rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(246, 130, 31, 0.3);
            border-radius: 12px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(246, 130, 31, 0.6);
        }

        /* ——— MESSAGE BUBBLES ——— */
        .message {
            margin-bottom: 0.2rem;
            padding: 0.85rem 1.2rem;
            border-radius: var(--radius-lg);
            max-width: 82%;
            word-break: break-word;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s;
            animation: messageIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message p {
            white-space: pre-line;
            margin: 0;
            overflow-wrap: anywhere;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #eef2f6;
        }

        /* user message – warm gradient + glow */
        .user-message {
            background: linear-gradient(145deg, #f6821f, #e0701a);
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 6px;
            border: 1px solid rgba(246, 130, 31, 0.3);
            box-shadow: 0 6px 24px rgba(246, 130, 31, 0.2);
        }
        .user-message p { color: #ffffff; }

        /* assistant message – subtle glass */
        .assistant-message {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .assistant-message p { color: #e4e9f0; }

        /* ——— TYPING INDICATOR ——— */
        .typing-indicator {
            display: none;
            padding: 0.3rem 1.5rem 0.6rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.01em;
            align-self: flex-start;
            position: relative;
            z-index: 1;
        }
        .typing-indicator.visible {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .typing-indicator::before {
            content: "● ● ●";
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: var(--primary-color);
            opacity: 0.6;
            animation: typingDots 1.2s infinite alternate;
        }
        @keyframes typingDots {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        /* ——— INPUT AREA ——— */
        .message-input {
            display: flex;
            align-items: flex-end;
            gap: 0.6rem;
            padding: 1rem 1.5rem 1.25rem;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 1;
        }

        #user-input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.03);
            color: #f0f4fa;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s, background 0.25s;
            line-height: 1.5;
            backdrop-filter: blur(4px);
        }

        #user-input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(246, 130, 31, 0.08);
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        #send-button {
            padding: 0.6rem 1.8rem;
            background: linear-gradient(145deg, var(--primary-color), #d96a18);
            color: #fff;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all var(--transition-smooth);
            box-shadow: 0 4px 20px rgba(246, 130, 31, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 50px;
            letter-spacing: 0.02em;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        #send-button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(246, 130, 31, 0.35);
        }

        #send-button:active:not(:disabled) {
            transform: scale(0.97);
        }

        #send-button:disabled {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
            cursor: not-allowed;
        }

        #send-button::after {
            content: "→";
            font-size: 1.3rem;
            line-height: 1;
            margin-left: 4px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        #send-button:hover:not(:disabled)::after {
            opacity: 1;
        }

        /* ——— FOOTER ——— */
        footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.04em;
            width: 100%;
            max-width: 820px;
            padding: 0.5rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            position: relative;
            z-index: 1;
        }

        footer p {
            background: rgba(255, 255, 255, 0.01);
            display: inline-block;
            padding: 0.2rem 1.5rem;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        /* ——— RESPONSIVE ——— */
        @media (max-width: 640px) {
            body { padding: 0.75rem; }
            .chat-container {
                height: calc(100vh - 180px);
                min-height: 380px;
                border-radius: var(--radius-lg);
            }
            .message { max-width: 92%; padding: 0.7rem 1rem; }
            #user-input { padding: 0.6rem 1rem; min-height: 44px; font-size: 0.9rem; }
            #send-button { padding: 0.5rem 1.2rem; min-height: 44px; font-size: 0.9rem; }
            header h1 { font-size: 1.6rem; }
            .chat-messages { padding: 1rem 0.75rem 0.25rem; }
            .message-input { padding: 0.75rem 0.75rem 1rem; gap: 0.4rem; }
        }

        @media (max-width: 420px) {
            header h1 { font-size: 1.4rem; }
            .message { font-size: 0.85rem; }
            #send-button { padding: 0.4rem 1rem; font-size: 0.8rem; min-height: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Cloudflare AI Chat</h1>
        <p>⚡ powered by Workers AI · modern interface</p>
    </header>

    <div class="chat-container">
        <!-- messages -->
        <div id="chat-messages" class="chat-messages">
            <div class="message assistant-message">
                <p>Hello! I'm an LLM chat app powered by Cloudflare Workers AI. How can I help you today?</p>
            </div>
        </div>

        <!-- typing indicator -->
        <div class="typing-indicator" id="typing-indicator">
            <span>AI is thinking</span>
        </div>

        <!-- input area -->
        <div class="message-input">
            <textarea
                id="user-input"
                placeholder="Type your message here…"
                rows="1"
                autofocus
            ></textarea>
            <button id="send-button">Send</button>
        </div>
    </div>

    <footer>
        <p>Cloudflare Workers AI Chat Template &copy; 2025</p>
    </footer>

    <!-- chat.js (unchanged) -->
    <script src="chat.js"></script>
</body>
</html>
